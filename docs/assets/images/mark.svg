<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="landschaft">
  <!-- three stacked isometric slabs: the landscape layers of the logo -->
  <g stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="32,40 8,28 8,33 32,45 56,33 56,28" fill="#166534"/>
    <polygon points="32,45 8,33 8,38 32,50 56,38 56,33" fill="#a3e635"/>
    <polygon points="32,50 8,38 8,43 32,55 56,43 56,38" fill="#15803d"/>
    <polygon points="32,16 8,28 32,40 56,28" fill="#22c55e"/>
    <polygon points="32,16 20,22 32,28 44,22" fill="#a3e635"/>
    <polygon points="32,28 20,22 8,28 20,34" fill="#15803d"/>
    <polygon points="32,28 44,22 56,28 44,34" fill="#15803d"/>
    <polygon points="32,28 20,34 32,40 44,34" fill="#a3e635"/>
  </g>
</svg>
