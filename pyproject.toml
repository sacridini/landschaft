[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "guidospy"
version = "0.3.0"
description = "Fast Python reimplementation of GuidosToolbox (GTB) raster analysis, starting with MSPA."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Eduardo Lacerda" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "scipy>=1.10",
    "xarray>=2023.1",
]

[project.optional-dependencies]
dask = ["dask[array]>=2023.1"]
test = ["pytest>=7", "scipy>=1.10", "dask[array]>=2023.1"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/guidospy"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reference: compare against outputs of the original GTB mspa executable",
    "live_reference: run the original GTB mspa executable (needs GUIDOSPY_MSPA_EXE)",
]
