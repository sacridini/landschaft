[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "landschaft"
version = "0.62.0"
description = "Fast, exact landscape pattern, fragmentation, landscape-metric and connectivity analysis for Python."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Eduardo Lacerda" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "scipy>=1.10",
    "xarray>=2023.1",
]

[project.optional-dependencies]
dask = ["dask[array]>=2023.1"]
plot = ["matplotlib>=3.5"]
vector = ["geopandas>=0.12", "pyarrow>=10"]
test = ["pytest>=7", "scipy>=1.10", "dask[array]>=2023.1"]
all = ["dask[array]>=2023.1", "matplotlib>=3.5", "geopandas>=0.12", "pyarrow>=10"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff", "matplotlib>=3.5"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/landschaft"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reference: compare against stored outputs of the original GTB code",
    "live_reference: run the original GTB code now (needs LANDSCHAFT_MSPA_EXE or GDL)",
]
