[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "landschaft"
version = "1.16.0"
description = "Fast, exact landscape pattern, fragmentation, landscape-metric and connectivity analysis for Python."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Eduardo Lacerda" }]
# Everything every tool uses is installed with the package: no optional features.
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "scipy>=1.10",
    "xarray>=2023.1",
    "dask[array]>=2023.1",
    "geopandas>=0.12",
    "pyarrow>=10",
    "openpyxl>=3",
    "matplotlib>=3.5",
    "folium>=0.15",
    "plotly>=5",
    "xyzservices",
    "Pillow",
    "contextily>=1.3",
    "pywebview>=5",
    "h3>=4",
    "dendropy>=4",
]

# for development only
[project.optional-dependencies]
test = ["pytest>=7", "threadpoolctl"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff", "matplotlib>=3.5"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/landschaft"]
cmake.build-type = "Release"
# the sdist holds what the build needs; tests, docs and tools stay in the repository
sdist.exclude = [".github", ".dockerignore", "Dockerfile", "IDEAS.md", "assets", "docs", "mkdocs.yml", "site",
                 "tests", "tools"]

# Windows: build with MSVC, whatever else is on PATH. A CMake that knows the installed Visual Studio
# (4.2 knows 2017 to 2026) makes it the default generator; an older one on PATH (e.g. Strawberry
# Perl's) would pick MinGW's gcc instead, whose modules need its runtime DLLs and lack the UCRT
# maths the results are checked against. pip fetches a recent CMake when the one found is older.
[[tool.scikit-build.overrides]]
if.platform-system = "^win32"
cmake.version = ">=4.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reference: compare against stored outputs of the original GTB code",
    "live_reference: run the original GTB code now (needs LANDSCHAFT_MSPA_EXE or GDL)",
]

# Wheels (cibuildwheel; .github/workflows/wheels.yml, tools/build_macos_wheels.sh):
# CPython 3.10-3.14 on the 64-bit platforms rasterio publishes wheels for.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32 *-win_arm64"
test-extras = ["test"]
test-requires = ["threadpoolctl"]
test-command = [
    "python -c \"import landschaft._core as c; assert c.openmp, 'built without OpenMP'\"",
    "pytest {project}/tests -q -p no:cacheprovider",
]

[tool.cibuildwheel.macos]
# Apple's clang has no OpenMP runtime: conda-forge's llvm-openmp (macOS 11+), which
# delocate bundles into the wheel.
archs = ["native"]
before-all = "bash tools/ci/install_libomp_macos.sh /tmp/landschaft-libomp"
config-settings = { "cmake.define.OpenMP_ROOT" = "/tmp/landschaft-libomp" }
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
# vcomp140.dll (MSVC's OpenMP runtime) is not installed with Python
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
