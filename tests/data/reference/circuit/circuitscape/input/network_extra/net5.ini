[Options for advanced mode]
ground_file_is_resistances = False
remove_src_or_gnd = rmvall
ground_file = input/network_extra/net5_grounds.txt
source_file = input/network_extra/net5_sources.txt

[Calculation options]
solver = cholmod

[Options for pairwise and one-to-all and all-to-one modes]
included_pairs_file = None
use_included_pairs = False
point_file = None

[Output options]
write_cur_maps = True
write_volt_maps = True
output_file = output/net5.out

[Habitat raster or graph]
habitat_file = input/network_extra/net5_graph.txt
habitat_map_is_resistances = True

[Circuitscape mode]
data_type = network
scenario = advanced
