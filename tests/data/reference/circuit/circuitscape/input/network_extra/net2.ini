[Options for advanced mode]
ground_file_is_resistances = True
remove_src_or_gnd = keepall
ground_file = None
source_file = None

[Calculation options]
solver = cholmod

[Options for pairwise and one-to-all and all-to-one modes]
included_pairs_file = input/network_extra/net2_pairs.txt
use_included_pairs = True
point_file = input/network_extra/net2_points.txt

[Output options]
write_cur_maps = False
write_volt_maps = False
output_file = output/net2.out

[Habitat raster or graph]
habitat_file = input/network_extra/net2_graph.txt
habitat_map_is_resistances = False

[Circuitscape mode]
data_type = network
scenario = pairwise
