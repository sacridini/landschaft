[Options for advanced mode]
ground_file_is_resistances = True
remove_src_or_gnd = keepall
ground_file = None
source_file = None

[Calculation options]
solver = cholmod

[Options for pairwise and one-to-all and all-to-one modes]
included_pairs_file = None
use_included_pairs = False
point_file = input/network_extra/net1_points.txt

[Output options]
write_cur_maps = True
write_volt_maps = True
output_file = output/net1.out

[Habitat raster or graph]
habitat_file = input/network_extra/net1_graph.txt
habitat_map_is_resistances = True

[Circuitscape mode]
data_type = network
scenario = pairwise
