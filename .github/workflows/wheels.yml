#
# Wheels (built and tested by cibuildwheel, see [tool.cibuildwheel] in pyproject.toml)
# and the sdist; published to PyPI when a GitHub release is published.
#
# Runs only by hand (Actions > Wheels > Run workflow) or on a published release,
# never on push. Publishing uses PyPI's trusted publishing: add this repository,
# this workflow (wheels.yml) and the environment "pypi" as a trusted publisher of
# the project on pypi.org first; no token is stored.
name: Wheels

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 and aarch64, Windows x86_64, macOS arm64 and x86_64 (Intel)
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
